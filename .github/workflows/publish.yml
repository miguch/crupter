name: Publish

on:
  push:
    tags:
      - '*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: crupter-linux-x86_64
          path: target/release/crupter

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: crupter-windows-x86_64
          path: target/release/crupter.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: crupter-macos-x86_64
          path: target/x86_64-apple-darwin/release/crupter
      - uses: actions/upload-artifact@v4
        with:
          name: crupter-macos-arm64
          path: target/aarch64-apple-darwin/release/crupter

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: ls -R artifacts
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/crupter-linux-x86_64/crupter
            artifacts/crupter-windows-x86_64/crupter.exe
            artifacts/crupter-macos-x86_64/crupter
            artifacts/crupter-macos-arm64/crupter
