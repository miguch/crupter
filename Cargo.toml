[package]
name = "crupter"
version = "0.3.0"
authors = ["Miguel Chan <vvchan@outlook.com>"]
edition = "2021"
license = "MIT"
description = "Crupter is a tool for file checksum and encryption."
homepage = "https://github.com/miguch/crupter"
repository = "https://github.com/miguch/crupter"

[dependencies]
aes = "0.8"
ctr = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
regex = "1"
digest = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
md-5 = "0.10"
indicatif = "0.17"
num_cpus = "1"
rayon = "1"
hex-literal = "0.4"
dirs = "5"
scrypt = "0.11"
rand = "0.8"
